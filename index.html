<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Titlu și descriere -->
    <title>FriendlyRival – Pariuri Fotbal</title>
    <meta name="description" content="Campionat amical de pariuri pe meciuri de fotbal cu prietenii tăi." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (bara de sus pe Android) -->
    <meta name="theme-color" content="#00d4ff" />

    <!-- iOS specifice -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FriendlyRival" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/ball.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Open Graph (preview când trimiți link-ul pe WhatsApp/Facebook) -->
    <meta property="og:title" content="FriendlyRival – Pariuri Fotbal" />
    <meta property="og:description" content="Fă pariuri amicale pe CM 2026 cu prietenii tăi!" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Fonturi -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;background:#080d18">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Înregistrare Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW înregistrat:', reg.scope))
            .catch(err => console.warn('SW eroare:', err));
        });
      }
    </script>
  </body>
</html>
